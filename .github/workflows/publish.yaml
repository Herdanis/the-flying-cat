name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/herdanis/the-flying-cat:sha-${{ steps.vars.outputs.sha7 }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/herdanis/the-flying-cat:latest' || '' }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/herdanis/the-flying-cat:{0}', github.ref_name) || '' }}
